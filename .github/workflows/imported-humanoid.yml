name: Imported humanoid study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/imported-humanoid.yml
      - scripts/prepare-xbot.mjs
      - scripts/review-bind-form.mjs
      - src/lib/refit-skin-bind.js
      - tests/refit-skin-bind.test.js
      - studies/xbot-form.js
      - studies/refitted-tail.js
      - scripts/load-xbot.mjs
      - scripts/review-imported-humanoid.mjs
      - src/lib/skeleton-pose.js
      - src/lib/bone-pose-state.js
      - studies/imported-xbot.js
      - studies/xbot-pose.js
      - tests/skeleton-pins.test.js
      - studies/pinned-inspection-arm.js
      - tests/skeleton-pose.test.js
      - src/render-stage.js
      - scripts/render.mjs
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node scripts/prepare-xbot.mjs
      - run: node --test tests/refit-skin-bind.test.js tests/skeleton-pins.test.js tests/skeleton-pose.test.js tests/local-render.test.js tests/two-link-pose.test.js tests/export-skin-roots.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Actual imported skin, authored stance and export roundtrip
        run: node scripts/review-imported-humanoid.mjs
      - name: Rest-shape refit, pose isolation and independent flexible tail
        run: node scripts/review-bind-form.mjs
      # Review evidence is not a third-party model library. Raw input and derived
      # GLBs remain local evaluation data, not gallery or Pages content.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-humanoid-review
          path: |
            renders/imported-humanoid-review/**/*.png
            renders/imported-humanoid-review/**/*.json
            renders/bind-form-review/**/*.png
            renders/bind-form-review/**/*.json
          if-no-files-found: error
