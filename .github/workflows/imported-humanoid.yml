name: Imported humanoid study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/imported-humanoid.yml
      - src/lib/skin-in-pose.js
      - tests/skin-in-pose.test.js
      - tests/armor-pigment.test.js
      - studies/posed-tail-sleeve.js
      - scripts/review-costume-flow.mjs
      - src/lib/evaluated-surface.js
      - src/lib/cyber/illustrated-head.js
      - tests/evaluated-surface.test.js
      - studies/posed-tail-guard.js
      - scripts/review-costume-forms.mjs
      - scripts/prepare-xbot.mjs
      - src/lib/bone-mount.js
      - src/lib/indexed-texture.js
      - tests/bone-mount.test.js
      - scripts/check-costume-export.mjs
      - scripts/review-armor-blockout.mjs
      - studies/prism-armor-blockout.js
      - studies/armor-*.js
      - studies/bone-mounted-prop.js
      - studies/data/armor-study-swatches.json
      - scripts/review-bind-form.mjs
      - scripts/review-upright.mjs
      - src/lib/refit-skin-bind.js
      - tests/refit-skin-bind.test.js
      - studies/xbot-form.js
      - studies/refitted-tail.js
      - scripts/load-xbot.mjs
      - scripts/review-imported-humanoid.mjs
      - src/lib/skeleton-pose.js
      - src/lib/bone-pose-state.js
      - studies/imported-xbot.js
      - studies/xbot-pose.js
      - tests/skeleton-pins.test.js
      - studies/pinned-inspection-arm.js
      - tests/skeleton-pose.test.js
      - src/render-stage.js
      - scripts/render.mjs
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node scripts/prepare-xbot.mjs
      - run: node --test tests/skin-in-pose.test.js tests/armor-pigment.test.js tests/evaluated-surface.test.js tests/bone-mount.test.js tests/refit-skin-bind.test.js tests/skeleton-pins.test.js tests/skeleton-pose.test.js tests/local-render.test.js tests/two-link-pose.test.js tests/export-skin-roots.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Actual imported skin, authored stance and export roundtrip
        run: node scripts/review-imported-humanoid.mjs
      - name: Rest-shape refit, pose isolation and independent flexible tail
        run: node scripts/review-bind-form.mjs
      - name: Upright body, side-hanging arms and downward head
        run: node scripts/review-upright.mjs
      - name: Rough bone-mounted armor, generated color samples and real textured GLB reload
        run: node scripts/review-armor-blockout.mjs
      - name: Fitted upright covers, head, feet and independent tail guard
        run: node scripts/review-costume-forms.mjs
      # Review evidence is not a third-party model library. Raw input and derived
      # GLBs remain local evaluation data, not gallery or Pages content.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imported-humanoid-review
          path: |
            renders/imported-humanoid-review/**/*.png
            renders/imported-humanoid-review/**/*.json
            renders/bind-form-review/**/*.png
            renders/bind-form-review/**/*.json
            renders/upright-review/**/*.png
            renders/upright-review/**/*.json
            renders/armor-blockout-review/**/*.png
            renders/armor-blockout-review/**/*.json
            renders/costume-forms-review/**/*.png
            renders/costume-forms-review/**/*.json
          if-no-files-found: error

  costume-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node scripts/prepare-xbot.mjs
      - run: node --test tests/skin-in-pose.test.js tests/armor-pigment.test.js tests/evaluated-surface.test.js tests/bone-mount.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Pose-authored flexible waist, thigh contours and independent cuff
        run: node scripts/review-costume-flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costume-flow-review
          path: |
            renders/costume-flow-review/**/*.png
            renders/costume-flow-review/**/*.json
          if-no-files-found: error
