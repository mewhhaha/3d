name: Construction reference intake
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - references/construction-videos.json
      - scripts/inspect_reference_videos.py
      - tests/test_reference_videos.py
      - .github/workflows/reference-intake.yml
permissions:
  contents: read
concurrency:
  group: reference-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test bounded parser and honest access states
        run: python3 -m unittest discover -s tests -p test_reference_videos.py -v
      - name: Try public metadata and available English captions once
        run: python3 scripts/inspect_reference_videos.py
      - name: Preserve access results even when a source is unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-reference-access
          path: reports/reference-videos.json
          retention-days: 1
