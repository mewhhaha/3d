name: Guided form and detail study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/lib/contour-line-maps.js
      - tests/lookback-style.test.js
      - scripts/review-lookback.mjs
      - studies/posed-enamel.js
      - src/lib/assembly-aim.js
      - tests/assembly-aim.test.js
      - tests/prism-shoulder-seat.test.js
      - scripts/review-shoulders.mjs
      - studies/aimed-inspector.js
      - tests/bridge-surface.test.js
      - tests/prism-girdle.test.js
      - studies/boundary-duct.js
      - scripts/review-girdle.mjs
      - tests/section-shape.test.js
      - scripts/review-primary.mjs
      - studies/section-housing.js
      - src/lib/radial-profile-maps.js
      - tests/radial-profile-maps.test.js
      - scripts/review-signals.mjs
      - studies/radial-enamel.js
      - scripts/scene-transfer.mjs
      - tests/scene-transfer.test.js
      - tests/prism-foot.test.js
      - scripts/review-feet.mjs
      - studies/apertured-bracket.js
      - src/lib/rigid-chain.js
      - tests/rigid-chain.test.js
      - tests/prism-hands.test.js
      - scripts/review-hands.mjs
      - studies/chain-gripper.js
      - src/lib/forms/structure.js
      - tests/structure-forms.test.js
      - tests/mass-forms.test.js
      - scripts/review-masses.mjs
      - studies/spiral-grip.js
      - src/lib/illustration*.js
      - scripts/review-illustration.mjs
      - tests/illustration.test.js
      - src/lib/section-pose.js
      - tests/section-pose.test.js
      - tests/prism-gesture.test.js
      - scripts/review-gesture.mjs
      - studies/section-duct.js
      - src/lib/two-link-pose.js
      - tests/two-link-pose.test.js
      - tests/prism-limbs.test.js
      - scripts/review-limbs.mjs
      - studies/two-link-boom.js
      - src/lib/shape-*.js
      - src/lib/surface-contour.js
      - tests/surface-contour.test.js
      - tests/prism-torso.test.js
      - scripts/review-torso.mjs
      - studies/surface-contour.js
      - src/lib/surface-boundary.js
      - src/lib/surface-cache.js
      - src/lib/contour-volume.js
      - src/lib/region-mask.js
      - src/lib/compact-geometry.js
      - src/lib/cyber/**
      - src/lib/forms/surface.js
      - src/lib/forms/bake-quality.js
      - models/cyber-form-study.js
      - studies/prism-*
      - references/prism-hair-outline.json
      - scripts/review-forms.mjs
      - scripts/measure-hair.mjs
      - scripts/measure-surfaces.mjs
      - scripts/raster-mask.mjs
      - tests/form-design.test.js
      - tests/surface-boundary.test.js
      - tests/surface-cache.test.js
      - tests/contour-volume.test.js
      - tests/shape-rails.test.js
      - tests/region-mask.test.js
      - tests/compact-geometry.test.js
      - .github/workflows/form-study.yml
permissions:
  contents: read
concurrency:
  group: prism-forms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - name: Curve, layering, immutable sculpt, pose and region-mask tests
        run: node --test tests/rigid-chain.test.js tests/prism-hands.test.js tests/mass-forms.test.js tests/structure-forms.test.js tests/section-pose.test.js tests/prism-gesture.test.js tests/two-link-pose.test.js tests/prism-limbs.test.js tests/surface-contour.test.js tests/prism-torso.test.js tests/illustration.test.js tests/shape-rails.test.js tests/form-design.test.js tests/region-mask.test.js tests/compact-geometry.test.js tests/surface-boundary.test.js tests/surface-cache.test.js tests/contour-volume.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Local-equivalent renders, exports, visible masks and normal transfer
        run: node scripts/review-forms.mjs
      - name: Illustrated head, PBR fallback and mechanical reuse
        run: node scripts/review-illustration.mjs
      - name: Contoured torso and independent service hatch
        run: node scripts/review-torso.mjs
      - name: Connected limb poses, scalloped shells and independent boom
        run: node scripts/review-limbs.mjs
      - name: Section-driven body gesture and mechanical duct
        run: node scripts/review-gesture.mjs
      - name: Humanoid mass groups and independent spiral grip
        run: node scripts/review-masses.mjs
      - name: Relaxed rigid digits, cutaway armor and independent gripper
        run: node scripts/review-hands.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-form-review
          path: |
            renders/form-review/
            renders/illustration-review/
            renders/torso-review/
            renders/limb-review/
            renders/gesture-review/
            renders/mass-review/
            renders/hand-review/
          if-no-files-found: error

  foot-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/scene-transfer.test.js tests/surface-contour.test.js tests/prism-foot.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Planted feet, curved apertures and independent bracket
        run: node scripts/review-feet.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foot-aperture-review
          path: renders/foot-review/
          if-no-files-found: error

  signal-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/radial-profile-maps.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Mapped optical faces and independent ceramic glaze
        run: node scripts/review-signals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-signal-review
          path: renders/signal-review/
          if-no-files-found: error

  primary-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/section-shape.test.js tests/mass-forms.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Primary forms and independent section housing
        run: node scripts/review-primary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: primary-form-review
          path: renders/primary-review/
          if-no-files-found: error

  girdle-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/bridge-surface.test.js tests/prism-girdle.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Connected girdle and independent boundary-driven duct
        run: node scripts/review-girdle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoulder-girdle-review
          path: renders/girdle-review/
          if-no-files-found: error

  shoulder-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/assembly-aim.test.js tests/prism-shoulder-seat.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Anchored shoulder modules and independent inspector
        run: node scripts/review-shoulders.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoulder-attitude-review
          path: renders/shoulder-review/
          if-no-files-found: error

  lookback-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:tangents
      - run: node --test tests/section-pose.test.js tests/lookback-style.test.js
      - run: npx playwright-core install --with-deps chromium
      - name: Whole-body gesture and material-only illustration controls
        run: node scripts/review-lookback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookback-pigment-review
          path: renders/lookback-review/
          if-no-files-found: error
