name: Anatomy component studies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/lib/forms/**', 'models/anatomy-*.js', 'src/anatomy-lab*', 'tests/*forms*', 'scripts/review-anatomy.mjs', '.github/workflows/anatomy-lab.yml']
permissions:
  contents: read
concurrency:
  group: anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/forms.test.js tests/hand-forms.test.js
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render geometry and baked normals under identical lights
        run: node scripts/review-anatomy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-studies
          path: |
            dist/assets/anatomy-hand/
            reports/anatomy-*
          if-no-files-found: error
