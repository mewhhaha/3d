name: Anatomy component studies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/lib/forms/**', 'src/lib/tangents.js', 'scripts/prepare-tangents.mjs', 'scripts/measure-arm.mjs', 'models/anatomy-*.js', 'src/anatomy-lab*', 'tests/*forms*', 'scripts/review-anatomy.mjs', 'scripts/blender_anatomy.py', '.github/workflows/anatomy-lab.yml']
permissions:
  contents: read
concurrency:
  group: anatomy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/prepare-tangents.mjs
      - run: node --test tests/*forms.test.js
      - name: Measure filtered normal detail against the high mesh
        run: node scripts/measure-arm.mjs
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render geometry and baked normals under identical lights
        run: node scripts/review-anatomy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-studies
          path: |
            dist/assets/anatomy-hand/
            reports/anatomy-*
            reports/arm-detail-quality.json
          if-no-files-found: error
      - name: Native Blender import, deformation and packed scenes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=2 blender --background --factory-startup --python-exit-code 1 --python scripts/blender_anatomy.py -- dist/assets/anatomy-hand native-anatomy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-blender
          path: native-anatomy/
          if-no-files-found: ignore
